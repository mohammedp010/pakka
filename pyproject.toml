[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pakka"
version = "0.1.0"
description = "Tests, guards and safety rules for semantic caches, with English and Hinglish support"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mohammedp010" }]
requires-python = ">=3.10"
keywords = ["semantic cache", "llm", "evaluation", "hinglish", "rag", "guardrails", "pii"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
    "Natural Language :: Hindi",
]
dependencies = ["numpy", "sentence-transformers>=3"]

[project.scripts]
pakka = "pakka.cli:main"

[project.optional-dependencies]
redis = ["redisvl>=0.4"]
bot = ["fastapi", "uvicorn", "httpx"]
dev = ["pytest"]
train = ["sentence-transformers[train]>=3"]

[tool.setuptools]
packages = ["pakka"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: needs a real embedding model or a running Redis",
    "e2e: calls the real LLM through OpenRouter (costs a little)",
]
addopts = "-m 'not integration and not e2e'"
