[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pakka"
version = "0.0.1"
description = "Tests, guards and safety rules for semantic caches"
requires-python = ">=3.10"
dependencies = ["numpy", "sentence-transformers>=3"]

[project.optional-dependencies]
redis = ["redisvl>=0.4"]
bot = ["fastapi", "uvicorn", "httpx"]
dev = ["pytest"]

[tool.setuptools]
packages = ["pakka"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: needs a real embedding model or a running Redis",
    "e2e: calls the real LLM through OpenRouter (costs a little)",
]
addopts = "-m 'not integration and not e2e'"
